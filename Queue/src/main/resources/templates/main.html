<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна сторінка</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="top-bar">
    <div class="top-bar-left">
        <p>Оберіть роль: <button onclick="window.location.href='/login-employee'" class="bar-item theme-l1">Я працівник</button>
            <button onclick="window.location.href='/login-client'" class="bar-item theme-l2">Я клієнт</button></p>
    </div>
</div>

<hr>

<h2>Поточна черга</h2>
<div id="in-progress-queue"></div>

<script>
    function loadInProgressQueue() {
        fetch('/queues/in-progress-queue')
            .then(response => response.json())
            .then(queue => {
                const queueDiv = document.getElementById('in-progress-queue');
                queueDiv.innerHTML = '';

                if (queue.length === 0) {
                    queueDiv.innerHTML = '<p>Черга пуста.</p>';
                } else {
                    const table = document.createElement('table');
                    const header = `<tr><th>Талон</th><th>Робоче місце</th></tr>`;
                    table.innerHTML = header;

                    queue.forEach(entry => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${entry.ticketNumber}</td>
                            <td>${entry.workplace?.workplaceName || entry.workplace.id}</td>
                        `;
                        table.appendChild(row);
                    });

                    queueDiv.appendChild(table);
                }
            })
            .catch(error => console.error('Error loading queue:', error));
    }

    loadInProgressQueue(); // Initial load of the in-progress queue
    setInterval(loadInProgressQueue, 5000); // Reload queue every 5 seconds
</script>

</body>
</html>
