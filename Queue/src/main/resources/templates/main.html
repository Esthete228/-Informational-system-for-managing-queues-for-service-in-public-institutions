<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна сторінка</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-top: 50px;
        }

        #in-progress-queue {
            margin-top: 50px;
            font-size: 36px;
            list-style-type: none;
            padding: 0;
        }

        #in-progress-queue table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 80%;
            margin: 0 auto;
        }

        #in-progress-queue th, #in-progress-queue td {
            padding: 15px;
            border-bottom: 1px solid #ccc;
            text-align: center;
        }

        #in-progress-queue th {
            background-color: #333;
            color: #fff;
        }

        .sound-alert {
            font-size: 24px;
            color: #d32f2f;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="top-bar-left">
        <p>Оберіть роль: <button onclick="window.location.href='/login-employee'" class="bar-item theme-l1 button">Я працівник</button>
            <button onclick="window.location.href='/login-client'" class="bar-item theme-l2 button">Я клієнт</button></p>
    </div>
</div>

<h1>Поточна черга</h1>

<div id="in-progress-queue"></div>
<div id="sound-alert" class="sound-alert"></div>

<script src="/main-page.js"></script>
</body>
</html>
