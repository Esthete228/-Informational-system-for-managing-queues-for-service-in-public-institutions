<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна сторінка</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<h1>Оберіть вашу роль</h1>
<div class="buttons">
    <button onclick="window.location.href='/login-employee'">Я працівник</button>
    <button onclick="window.location.href='/login-client'">Я клієнт</button>
</div>

<hr>

<h2>Поточна черга</h2>
<div id="queue"></div>

<script>
    function loadQueue() {
        fetch('/all-in-queue')
            .then(response => response.json())
            .then(queue => {
                const queueDiv = document.getElementById('queue');
                queueDiv.innerHTML = '';
                if (queue.length === 0) {
                    queueDiv.innerHTML = '<p>Черга пуста.</p>';
                } else {
                    queue.forEach(entry => {
                        const entryElement = document.createElement('div');
                        entryElement.innerHTML = `
              <p>Клієнт: ${entry.client.username} - Послуга: ${entry.serviceEntity.serviceName}</p>
            `;
                        queueDiv.appendChild(entryElement);
                    });
                }
            });
    }

    loadQueue(); // Initial load of the queue
    setInterval(loadQueue, 5000); // Reload queue every 5 seconds
</script>

</body>
</html>
