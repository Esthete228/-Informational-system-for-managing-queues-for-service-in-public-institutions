<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Введіть OTP</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<h1>Введіть код OTP</h1>
<form action="/verify-otp" method="POST">
    <input type="hidden" name="phone" th:value="${phone}">
    <label for="otp">OTP:</label>
    <!-- Валідація на клієнтській стороні: лише 6 цифр -->
    <input type="text" id="otp" name="otp" required pattern="^[0-9]{6}$" title="Введіть 6-значний код"><br>
    <button type="submit" class="button">Підтвердити</button>
</form>
</body>
</html>
