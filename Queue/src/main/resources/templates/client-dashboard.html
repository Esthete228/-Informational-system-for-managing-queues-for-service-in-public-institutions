<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особистий кабінет клієнта</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      position: relative;
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .close {
      font-size: 25px;
      font-weight: bold;
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
    }

    @media screen and (max-width: 768px) {
      .modal-content {
        width: 90%;
      }
    }
  </style>
</head>
<body>
<h1>Особистий кабінет</h1>
<div class="top-bar">
  <div class="top-bar-left">
    <button onclick="openModal('create-appointment-modal')">Створити попередній запис в чергу</button>
  </div>
  <div class="top-bar-right">
    <button onclick="window.location.href='/logout'">Вийти з облікового запису</button>
  </div>
</div>

<h1>Ваші записи</h1>
<div id="appointments"></div>

<!-- Модальне вікно для попереднього запису -->
<div class="modal" id="create-appointment-modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('create-appointment-modal')">&times;</span>
    <h1>Запис на послугу</h1>
      <form id="bookAppointmentForm">
        <label for="serviceId">Виберіть послугу:</label>
        <select id="serviceId" required>
          <option value="">Виберіть послугу</option>
          <!-- Цей список буде заповнений з бази даних -->
        </select>
        <label for="appointmentTime">Час запису:</label>
        <input type="datetime-local" id="appointmentTime" required> <!-- Вибір часу запису -->
        <input type="hidden" id="clientId" value="${clientId}"> <!-- Припустимо, ви зберігаєте clientId у сесії -->
        <button type="submit" class="btn-primary">Записатися</button>
        <button type="button" class="btn-secondary" onclick="closeModal('rescheduleModal')">Скасувати</button>
    </form>
  </div>
</div>

<!-- Модальне вікно для зміни часу запису -->
<div class="modal" id="rescheduleModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('rescheduleModal')">&times;</span>
    <h2>Перезапис</h2>
    <form id="rescheduleForm">
      <input type="hidden" id="rescheduleAppointmentId">
      <label for="newAppointmentTime">Новий час:</label>
      <input type="datetime-local" id="newAppointmentTime" required>
      <button type="submit" class="btn-primary">Підтвердити</button>
      <button type="button" class="btn-secondary" onclick="closeModal('rescheduleModal')">Скасувати</button>
    </form>
  </div>
</div>

<script>
  // Завантаження записів клієнта
  fetch('/appointments/client-appointments')
          .then(response => response.json())
          .then(appointments => {
            const appointmentsDiv = document.getElementById('appointments');
            if (appointments.length === 0) {
              appointmentsDiv.innerHTML = 'У вас немає записів.';
            } else {
              appointments.forEach(appointment => {
                const appointmentElement = document.createElement('div');
                appointmentElement.innerHTML = `
            <strong>Послуга:</strong> ${appointment.serviceEntity.serviceName}<br>
            <strong>Час запису:</strong> ${new Date(appointment.appointmentTime).toLocaleString()}<br>
            <button onclick="openModal('rescheduleModal', ${appointment.id})" class="btn-primary">Перезапис</button>
            <button onclick="deleteAppointment(${appointment.id})" class="btn-secondary">Видалити</button>
            <hr>
          `;
                appointmentsDiv.appendChild(appointmentElement);
              });
            }
          })
          .catch(error => {
            console.error('Помилка при завантаженні записів:', error);
          });

  // Відкрити модальне вікно
  function openModal(modalId, appointmentId = null) {
    if (appointmentId !== null) {
      document.getElementById('rescheduleAppointmentId').value = appointmentId;
    }
    document.getElementById(modalId).style.display = 'flex';
  }

  // Закрити модальне вікно
  function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
  }

  // Завантаження всіх послуг для запису клієнта
  fetch('/services/all-services')
          .then(response => response.json())
          .then(services => {
            const serviceSelect = document.getElementById('serviceId'); // Вибираємо правильний select
            services.forEach(service => {
              const option = document.createElement('option');
              option.value = service.id;
              option.textContent = service.serviceName; // Відображаємо назву послуги
              serviceSelect.appendChild(option); // Додаємо опцію у select
            });
          })
          .catch(error => console.error('Error:', error));

  // Логіка для бронювання послуги
  document.getElementById('bookAppointmentForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const serviceId = document.getElementById('serviceId').value;
    const appointmentTime = document.getElementById('appointmentTime').value;
    const clientId = document.getElementById('clientId').value;

    if (!clientId) {
      alert('Не вдалося отримати ваш ідентифікатор клієнта. Спробуйте ще раз.');
      return;
    }

    fetch('/appointments/book', { // Правильний шлях
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        serviceId: serviceId,
        clientId: clientId,
        appointmentTime: appointmentTime
      })
    })
            .then(response => {
              if (response.ok) {
                alert('Запис успішно створено!');
                location.reload();
              } else {
                response.text().then(text => alert('Не вдалося створити запис: ' + text));
              }
            })
            .catch(error => console.error('Error:', error));
  });

  // Підтвердити перезапис
  document.getElementById('rescheduleForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const appointmentId = document.getElementById('rescheduleAppointmentId').value;
    const newTime = document.getElementById('newAppointmentTime').value;

    if (newTime) {
      fetch(`/appointments/update/${appointmentId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newAppointmentTime: newTime })
      })
              .then(response => {
                if (response.ok) {
                  closeModal('rescheduleModal');
                  location.reload();
                } else {
                  alert("Не вдалося перезаписати запис. Спробуйте ще раз.");
                }
              });
    }
  });

  // Видалення запису
  function deleteAppointment(appointmentId) {
    fetch(`/appointments/delete/${appointmentId}`, {
      method: 'DELETE'
    })
            .then(response => {
              if (response.ok) {
                location.reload();
              } else {
                alert("Не вдалося видалити запис. Спробуйте ще раз.");
              }
            });
  }
</script>
</body>
</html>
