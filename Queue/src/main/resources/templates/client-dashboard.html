<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особистий кабінет клієнта</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      position: relative;
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .close {
      font-size: 25px;
      font-weight: bold;
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
    }

    @media screen and (max-width: 768px) {
      .modal-content {
        width: 90%;
      }
    }
  </style>
</head>
<body>
<h1>Особистий кабінет</h1>
<div class="top-bar">
  <div class="top-bar-left">
    <button onclick="openModal('create-appointment-modal')">Створити попередній запис в чергу</button>
  </div>
  <div class="top-bar-right">
    <button onclick="window.location.href='/logout'">Вийти з облікового запису</button>
  </div>
</div>

<h1>Ваші записи</h1>
<div id="appointments"></div>

<!-- Модальне вікно для попереднього запису -->
<div class="modal" id="create-appointment-modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('create-appointment-modal')">&times;</span>
    <h1>Запис на послугу</h1>
      <form id="bookAppointmentForm">
        <label for="serviceId">Виберіть послугу:</label>
        <select id="serviceId" required>
          <option value="">Виберіть послугу</option>
        </select>
        <label for="appointmentTime">Час запису:</label>
        <input type="datetime-local" id="appointmentTime" required>
        <input type="hidden" id="clientId" value="${clientId}">
        <button type="submit" class="button">Записатися</button>
        <button type="button" class="button" onclick="closeModal('create-appointment-modal')">Скасувати</button>
    </form>
  </div>
</div>

<!-- Модальне вікно для зміни часу запису -->
<div class="modal" id="rescheduleModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('rescheduleModal')">&times;</span>
    <h2>Перезапис</h2>
    <form id="rescheduleForm">
      <input type="hidden" id="rescheduleAppointmentId">
      <label for="newAppointmentTime">Новий час:</label>
      <input type="datetime-local" id="newAppointmentTime" required>
      <button type="submit" class="button">Підтвердити</button>
      <button type="button" class="button" onclick="closeModal('rescheduleModal')">Скасувати</button>
    </form>
  </div>
</div>

<script src="/client-panel.js"></script>
</body>
</html>
