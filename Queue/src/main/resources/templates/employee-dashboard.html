<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дошка працівника</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<h1>Дошка працівника</h1>

<div id="notification" style="display: none;"></div> <!-- Notification area -->

<h2>Створити талон</h2>
<form id="create-ticket-form">
  <label for="serviceId">Оберіть послугу:</label>
  <select id="serviceId" name="serviceId" required></select>

  <label for="workplaceId">Оберіть робоче місце:</label>
  <select id="workplaceId" name="workplaceId" required></select>

  <button type="submit">Створити талон</button>
</form>

<h2>Оновити талон</h2>
<form id="update-ticket-form">
  <label for="queueId">Оберіть талон:</label>
  <select id="queueId" name="queueId" required></select>

  <label for="newServiceId">Нова послуга:</label>
  <select id="newServiceId" name="newServiceId" required></select>

  <label for="newWorkplaceId">Нове робоче місце:</label>
  <select id="newWorkplaceId" name="newWorkplaceId" required></select>

  <button type="submit">Оновити талон</button>
</form>

<h2>Видалити талон</h2>
<form id="delete-ticket-form">
  <label for="deleteQueueId">Оберіть талон:</label>
  <select id="deleteQueueId" name="deleteQueueId" required></select>
  <button type="submit">Видалити талон</button>
</form>

<h2>Поточна черга</h2>
<div id="current-queue"></div>

<h2>Викликати клієнта</h2>
<button id="call-next-client">Викликати наступного клієнта</button>

<h2>Клієнт, що обслуговується:</h2>
<div id="current-client"></div> <!-- Active client area -->

<h2>Передати клієнта</h2>
<form id="transfer-client-form">
  <label for="transferQueueId">Оберіть талон:</label>
  <select id="transferQueueId" name="transferQueueId" required></select>

  <label for="transferWorkplaceId">Оберіть нове робоче місце:</label>
  <select id="transferWorkplaceId" name="transferWorkplaceId" required></select>

  <button type="submit">Передати клієнта</button>
</form>

<h2>Завершити сеанс</h2>
<form id="complete-session-form">
  <label for="completeQueueId">Оберіть талон:</label>
  <select id="completeQueueId" name="completeQueueId" required></select>
  <button type="submit">Завершити сеанс</button>
</form>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const createTicketForm = document.getElementById("create-ticket-form");
    const updateTicketForm = document.getElementById("update-ticket-form");
    const deleteTicketForm = document.getElementById("delete-ticket-form");
    const transferClientForm = document.getElementById("transfer-client-form");
    const completeSessionForm = document.getElementById("complete-session-form");
    const currentQueueDiv = document.getElementById("current-queue");
    const notificationDiv = document.getElementById("notification");

    async function populateDropdowns() {
      try {
        const [services, workplaces] = await Promise.all([
          fetch('/services/all-services').then(res => res.json()),
          fetch('/workplaces/all-workplaces').then(res => res.json()),
        ]);

        const serviceSelects = [document.getElementById('serviceId'), document.getElementById('newServiceId')];
        const workplaceSelects = [document.getElementById('workplaceId'), document.getElementById('newWorkplaceId'), document.getElementById('transferWorkplaceId')];

        serviceSelects.forEach(select => {
          select.innerHTML = '<option value="">Оберіть послугу</option>';
          services.forEach(service => {
            const option = new Option(service.serviceName, service.id);
            select.appendChild(option);
          });
        });

        workplaceSelects.forEach(select => {
          select.innerHTML = '<option value="">Оберіть робоче місце</option>';
          workplaces.forEach(workplace => {
            const option = new Option(workplace.workplaceName, workplace.id);
            select.appendChild(option);
          });
        });
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    async function loadQueue() {
      // Fetch the current workplace ID from the session
      const response = await fetch('/current-workplace');
      if (!response.ok) {
        console.error("Failed to load workplace ID.");
        return; // Exit if the fetch fails
      }
      const workplaceId = await response.json();
      console.log("Current Workplace ID:", workplaceId); // Log the workplace ID

      if (!workplaceId) {
        console.error("Workplace ID is undefined. Cannot load the queue.");
        return; // Exit the function if workplaceId is not defined
      }

      fetch(`/queues/current-queue/${workplaceId}`)
              .then(response => {
                if (!response.ok) {
                  throw new Error("Network response was not ok");
                }
                return response.json();
              })
              .then(data => {
                console.log("Queue data:", data); // Log the fetched data
              })
              .catch(error => {
                console.error('Error loading queue:', error);
              });
    }


    async function populateCurrentQueue() {
      // Отримати workplaceId з сесії
      const response = await fetch('/current-workplace');
      if (!response.ok) {
        console.error("Failed to load workplace ID.");
        return; // Вийти, якщо запит не вдалий
      }
      const workplaceId = await response.json();
      console.log("Current Workplace ID:", workplaceId); // Логування workplace ID

      if (!workplaceId) {
        console.error("Workplace ID is undefined. Cannot load the queue.");
        return; // Вийти з функції, якщо workplaceId не визначений
      }

      // Використати workplaceId для отримання поточної черги
      try {
        const queueResponse = await fetch(`/queues/current-queue/${workplaceId}`);
        if (!queueResponse.ok) {
          throw new Error("Failed to load queue data.");
        }

        const queueData = await queueResponse.json();
        console.log("Queue data:", queueData); // Логування отриманих даних для налагодження
        currentQueueDiv.innerHTML = "";

        const queueSelects = [
          document.getElementById("queueId"),
          document.getElementById("deleteQueueId"),
          document.getElementById("transferQueueId"),
          document.getElementById("completeQueueId"),
        ];

        // Очистити попередні опції у селектах
        queueSelects.forEach(select => {
          select.innerHTML = '<option value="">Оберіть талон</option>';
        });

        if (queueData && queueData.length > 0) {
          queueData.forEach(ticket => {
            const div = document.createElement("div");
            div.innerText = `Талон: ${ticket.ticketNumber}, Послуга: ${ticket.serviceEntity.name}, Статус: ${ticket.status}`;
            currentQueueDiv.appendChild(div);

            queueSelects.forEach(select => {
              const option = new Option(`Талон ${ticket.ticketNumber}`, ticket.id);
              select.appendChild(option);
            });
          });
        } else {
          currentQueueDiv.innerText = "Черга пуста.";
        }
      } catch (error) {
        console.error("Error loading current queue:", error);
      }
    }

    function showNotification(message) {
      notificationDiv.innerText = message;
      notificationDiv.style.display = 'block';
      setTimeout(() => {
        notificationDiv.style.display = 'none';
      }, 3000); // Hide after 3 seconds
    }

    createTicketForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      const serviceId = document.getElementById("serviceId").value;
      const workplaceId = document.getElementById("workplaceId").value; // Використовуємо значення з випадаючого списку

      try {
        const response = await fetch('/queues/create-ticket', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ serviceId, workplaceId }) // Передаємо обране значення
        });

        if (response.ok) {
          showNotification("Талон успішно створено!");
          await populateCurrentQueue(); // Оновлення черги
        } else {
          showNotification("Не вдалося створити талон.");
        }
      } catch (error) {
        console.error('Error:', error);
        showNotification("Сталася помилка при створенні талону.");
      }
    });

    updateTicketForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      const queueId = document.getElementById("queueId").value;
      const newServiceId = document.getElementById("newServiceId").value;
      const newWorkplaceId = document.getElementById("newWorkplaceId").value; // Використовуємо значення з випадаючого списку

      try {
        const response = await fetch(`/queues/update-ticket/${queueId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ serviceId: newServiceId, workplaceId: newWorkplaceId }) // Передаємо обране значення
        });

        if (response.ok) {
          showNotification("Талон успішно оновлено!");
          await populateCurrentQueue();
        } else {
          showNotification("Не вдалося оновити талон.");
        }
      } catch (error) {
        console.error('Error:', error);
        showNotification("Сталася помилка при оновленні талону.");
      }
    });

    deleteTicketForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      const queueId = document.getElementById("deleteQueueId").value;
      const workplaceId = document.getElementById("workplaceId").value; // Отримуємо workplaceId з випадаючого списку

      try {
        const response = await fetch(`/queues/delete-ticket/${queueId}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workplaceId }) // Передаємо обране значення
        });

        if (response.ok) {
          showNotification("Талон успішно видалено!");
          await populateCurrentQueue();
        } else {
          showNotification("Не вдалося видалити талон.");
        }
      } catch (error) {
        console.error('Error:', error);
        showNotification("Сталася помилка при видаленні талону.");
      }
    });

    document.getElementById("call-next-client").addEventListener("click", async function() {
      const workplaceId = document.getElementById("workplaceId").value;

      try {
        const response = await fetch(`/queues/call-next-client/${workplaceId}`, {
          method: 'POST'
        });

        if (response.ok) {
          const client = await response.json();
          document.getElementById("current-client").innerText = `Клієнт: ${client.ticketNumber}`;
          showNotification("Клієнта викликано!");
          await populateCurrentQueue();
        } else {
          showNotification("Не вдалося викликати клієнта.");
        }
      } catch (error) {
        console.error('Error:', error);
        showNotification("Сталася помилка при виклику клієнта.");
      }
    });

    transferClientForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      const queueId = document.getElementById("transferQueueId").value;
      const transferWorkplaceId = document.getElementById("transferWorkplaceId").value;

      try {
        const response = await fetch(`/queues/transfer-client/${queueId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workplaceId: transferWorkplaceId })
        });

        if (response.ok) {
          showNotification("Клієнта успішно передано!");
          await populateCurrentQueue();
        } else {
          showNotification("Не вдалося передати клієнта.");
        }
      } catch (error) {
        console.error('Error:', error);
        showNotification("Сталася помилка при передачі клієнта.");
      }
    });

    completeSessionForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      const queueId = document.getElementById("completeQueueId").value;

      try {
        const response = await fetch(`/queues/complete-session/${queueId}`, {
          method: 'PUT'
        });

        if (response.ok) {
          showNotification("Сеанс успішно завершено!");
          await populateCurrentQueue();
          document.getElementById("current-client").innerText = "";
        } else {
          showNotification("Не вдалося завершити сеанс.");
        }
      } catch (error) {
        console.error('Error:', error);
        showNotification("Сталася помилка при завершенні сеансу.");
      }
    });

    document.getElementById("workplaceId").addEventListener("change", populateCurrentQueue);

    populateDropdowns();
    populateCurrentQueue();
    // Оновлюйте поточну чергу кожні 5 секунд
    setInterval(loadQueue, 5000);
    setInterval(populateCurrentQueue, 5000);
  });
</script>
</body>
</html>
