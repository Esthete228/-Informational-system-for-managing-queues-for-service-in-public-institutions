<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дошка працівника</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal-content { background-color: #f4f4f4; margin: 10% auto; padding: 20px; width: 80%; max-width: 500px; }
    .close { float: right; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>
<h1>Дошка працівника</h1>
<!-- Меню панель -->
<div class="top-bar">
  <div class="top-bar-left">
    <button onclick="openModal('create-ticket-modal')">Створити талон</button>
    <button onclick="openModal('update-ticket-modal')">Оновити талон</button>
    <button onclick="openModal('delete-ticket-modal')">Видалити талон</button>
    <button onclick="openModal('transfer-client-modal')">Передати клієнта</button>
    <button id="call-next-client" class="button">Викликати наступного клієнта</button>
    <button id="complete-session-button" class="button">Завершити сеанс</button>
  </div>
  <div class="top-bar-right">
    <button onclick="window.location.href='/logout'">Вийти з облікового запису</button>
  </div>
</div>
<div style="margin : 10px">
<!-- Notification area -->
<div id="notification" style="display: none;"></div>
<!-- Поточна черга -->
<h2>Поточна черга</h2>
<div id="current-queue">Завантаження...</div>

<!-- Клієнт, що обслуговується -->
<h2>Клієнт, що обслуговується:</h2>
<div id="current-client">Завантаження...</div>
</div>
<!-- Модальні вікна -->
<div id="create-ticket-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('create-ticket-modal')">&times;</span>
    <h2>Створити талон</h2>
    <form id="create-ticket-form">
      <label for="serviceId">Оберіть послугу:</label>
      <select id="serviceId" name="serviceId" required></select>

      <label for="workplaceId">Оберіть робоче місце:</label>
      <select id="workplaceId" name="workplaceId" required></select>

      <button type="submit" class="button">Створити талон</button>
    </form>
  </div>
</div>

<div id="update-ticket-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('update-ticket-modal')">&times;</span>
    <h2>Оновити талон</h2>
    <form id="update-ticket-form">
      <label for="queueId">Оберіть талон:</label>
      <select id="queueId" name="queueId" required></select>

      <label for="newServiceId">Нова послуга:</label>
      <select id="newServiceId" name="newServiceId" required></select>

      <label for="newWorkplaceId">Нове робоче місце:</label>
      <select id="newWorkplaceId" name="newWorkplaceId" required></select>

      <button type="submit" class="button">Оновити талон</button>
    </form>
  </div>
</div>

<div id="delete-ticket-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('delete-ticket-modal')">&times;</span>
    <h2>Видалити талон</h2>
    <form id="delete-ticket-form">
      <label for="deleteQueueId">Оберіть талон:</label>
      <select id="deleteQueueId" name="deleteQueueId" required></select>
      <button type="submit" class="button">Видалити талон</button>
    </form>
  </div>
</div>

<div id="transfer-client-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('transfer-client-modal')">&times;</span>
    <h2>Передати клієнта</h2>
    <form id="transfer-client-form">
      <label for="transferWorkplaceId">Оберіть нове робоче місце:</label>
      <select id="transferWorkplaceId" name="transferWorkplaceId" required></select>
      <button type="submit" class="button">Передати клієнта</button>
    </form>
  </div>
</div>

<script src="/employee-panel.js"></script>
</body>
</html>
