<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звіти</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<h1>Звіти про роботу черг</h1>

<!-- Date Range Picker for the report -->
<form id="report-form">
    <label for="startDate">Початок періоду:</label>
    <input type="datetime-local" id="startDate" name="startDate" required><br><br>

    <label for="endDate">Кінець періоду:</label>
    <input type="datetime-local" id="endDate" name="endDate" required><br><br>

    <button type="submit">Згенерувати звіт</button>
</form>

<hr>

<!-- Section to display the generated report -->
<div id="report-results" style="display: none;">
    <h2>Звіт</h2>
    <p id="totalTickets"></p>
    <p id="averageWaitingTime"></p>
    <a id="download-link" href="#" download>Скачати звіт</a>
</div>

<script>
    // Handle form submission to request a report from the backend
    document.getElementById('report-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent default form submission

        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        if (!startDate || !endDate) {
            alert('Будь ласка, заповніть обидва поля для дати.');
            return;
        }

        // Prepare request data
        const data = {
            startDate: startDate,
            endDate: endDate
        };

        // Send the request to generate the report
        fetch('/reports/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
            .then(response => response.json())
            .then(report => {
                // Display the report in the UI
                if (report) {
                    document.getElementById('totalTickets').innerText = `Кількість талонів: ${report.totalTickets}`;
                    document.getElementById('averageWaitingTime').innerText = `Середній час очікування: ${report.averageWaitingTime} хвилин`;

                    // Create a link to download the report as a CSV file
                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = `data:text/csv;charset=utf-8,${encodeURIComponent(report.csvContent)}`;

                    // Show the results
                    document.getElementById('report-results').style.display = 'block';
                } else {
                    alert('Не вдалося згенерувати звіт.');
                }
            })
            .catch(error => {
                console.error('Error generating report:', error);
                alert('Сталася помилка при генерації звіту.');
            });
    });
</script>

</body>
</html>
